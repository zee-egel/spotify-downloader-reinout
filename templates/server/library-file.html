<div class="row library-row" data-path="${rel}">
  <div>
    <div class="filename">
      <span class="file-icon" aria-hidden="true">♪</span>
      <strong>${name}</strong>
    </div>
    <div class="muted">${size} · Gewijzigd ${modified}</div>
  </div>
  <div class="right">
    <a class="link" href="/file?path=${quoted}">Downloaden</a>
    ${delete}
  </div>
</div>
