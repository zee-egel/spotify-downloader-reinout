<section data-view="files" id="files">
  <div class="sectionhead">
    <div>
      <h1>Bibliotheek</h1>
      <p class="muted">
        Klaar om te luisteren. Download losse bestanden of een hele map.
      </p>
      <div class="crumbs">${crumbs}</div>
    </div>
    <a class="link" href="${refresh_url}#files">Vernieuwen</a>
  </div>
  <form class="controls" method="get" action="/#files">
    <input
      id="library-search"
      type="search"
      autocomplete="off"
      placeholder="Deze map doorzoeken…"
      aria-label="Deze map doorzoeken"
    />
    <input type="hidden" name="folder" value="${folder}" />
    <select id="file-sort" name="sort" aria-label="Bestanden sorteren">
      <option value="name" selected="${sort_name}">Naam</option>
      <option value="type" selected="${sort_type}">Type</option>
      <option value="size" selected="${sort_size}">Grootte</option>
      <option value="modified" selected="${sort_modified}">Gewijzigd</option>
    </select>
    <select name="dir" aria-label="Sorteerrichting bestanden">
      <option value="asc" selected="${direction_asc}">Oplopend</option>
      <option value="desc" selected="${direction_desc}">Aflopend</option>
    </select>
    <button type="submit">Sorteren</button>
  </form>
  <div class="list" id="library-list">${files}</div>
  <details class="section library-activity" id="library-activity">
    <summary>Downloads in deze sessie</summary>
    <div id="library-transfers" class="list"></div>
    <button type="button" id="more-library-transfers" hidden>Meer tonen</button>
  </details>
  <p id="library-error" class="error" role="status"></p>
  <p id="library-no-match" class="empty" hidden>
    Geen bestanden gevonden voor je zoekopdracht.
  </p>
</section>
