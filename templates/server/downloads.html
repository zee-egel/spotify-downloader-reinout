<section data-view="transfers" id="transfers">
  <div class="page-heading">
    <h1>Downloads</h1>
    <p>
      Live downloads van Soulseek. Het zoeken naar ontbrekende nummers volg je bij
      <a class="link" href="#start">je imports</a>.
    </p>
  </div>
  <p class="queue-summary" id="queue-summary"></p>
  <div class="notice" id="queue-notice" hidden>
    <span id="queue-error"></span>
    <button type="button" id="reconnect">Opnieuw verbinden</button>
  </div>
  <div class="controls">
    <input
      id="transfer-search"
      type="search"
      name="search"
      autocomplete="off"
      placeholder="Downloads zoeken…"
      aria-label="Downloads zoeken"
    />
    <select id="transfer-status" aria-label="Downloadstatus filteren">
      <option value="">Alle statussen</option>
      <option value="downloading">Bezig met downloaden</option>
      <option value="queued">In de wachtrij</option>
      <option value="failed">Mislukt</option>
      <option value="completed">Klaar</option>
      <option value="unknown">Wachten op status</option>
    </select>
    <select id="transfer-sort" aria-label="Downloads sorteren">
      <option value="status">Actief bovenaan</option>
      <option value="newest">Nieuwste bovenaan</option>
      <option value="progress">Voortgang</option>
      <option value="name">Naam</option>
      <option value="speed">Snelheid</option>
    </select>
    <button
      id="transfer-reverse"
      type="button"
      data-reverse="false"
      aria-pressed="false"
    >
      Volgorde omkeren
    </button>
  </div>
  <div class="list" id="transfer-list"></div>
  <button id="more-transfers" type="button" hidden>Meer tonen</button>
</section>
