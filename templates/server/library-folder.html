<div class="row library-row folder" data-path="${rel}">
  <div>
    <a class="filename" href="/?folder=${folder_path}${sort_query}#files">
      <span class="file-icon" aria-hidden="true">≡</span>
      <strong>${name}</strong>
    </a>
    <div class="muted">${count} item${plural} · Gewijzigd ${modified}</div>
  </div>
  <div class="right">
    <a class="link" href="/?folder=${folder_path}${sort_query}#files">Openen</a>
    <a class="link" href="/zip?path=${folder_path}">ZIP downloaden</a>
    ${delete}
  </div>
</div>
