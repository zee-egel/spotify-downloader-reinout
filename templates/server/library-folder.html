<div class="row library-row folder" data-path="${rel}">
  <div>
    <a class="filename" href="/?folder=${folder_path}${sort_query}#files">
      <span class="file-icon" aria-hidden="true">≡</span>
      <strong>${name}</strong>
    </a>
    <div class="muted">${count} item${plural} · Modified ${modified}</div>
  </div>
  <div class="right">
    <a class="link" href="/?folder=${folder_path}${sort_query}#files">Open</a>
    <a class="link" href="/zip?path=${folder_path}">Download ZIP</a>
    ${delete}
  </div>
</div>
