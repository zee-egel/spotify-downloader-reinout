<div class="track-row" data-key="${key}">
  <span class="track-number">${number}</span>
  ${sourceIcon}
  <div class="track-info">
    <span class="track-title" title="${title}">${displayTitle}</span>
    <div class="muted">${artist}</div>
    ${reason}
    ${source}
  </div>
  ${badge}
  ${percent}
</div>
